name: Codex review scenario

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Review scenario
        required: true
        default: unknown-data-as-zero
        type: choice
        options:
          - unknown-data-as-zero
          - explicit-zero-safe
          - duplicate-root-cause
          - p2-only-noise
          - public-sensitive-asset
      effort:
        description: Reasoning effort
        required: true
        default: high
        type: choice
        options: [high, xhigh, max]

permissions:
  contents: read

concurrency:
  group: codex-pro-account
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: [self-hosted, linux, codex-pro]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Write trusted scenario context
        env:
          HEAD_SHA: ${{ github.sha }}
          RULE_CATALOG: ${{ github.workspace }}/docs/REVIEW_RULE_IDS.md
        working-directory: scenarios/review/${{ inputs.scenario }}
        run: |
          rm -f .codex-eval-context.json
          node -e 'require("node:fs").writeFileSync(".codex-eval-context.json", JSON.stringify({scenarioDirectory: ".", headSha: process.env.HEAD_SHA, ruleCatalog: process.env.RULE_CATALOG}, null, 2))'

      - name: Verify ChatGPT-managed Codex auth
        run: codex login status 2>&1 | grep -F "Logged in using ChatGPT"

      - name: Run read-only scenario review
        env:
          EFFORT: ${{ inputs.effort }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          codex exec \
            --skip-git-repo-check \
            --cd "$GITHUB_WORKSPACE/scenarios/review/$SCENARIO" \
            --output-last-message "$RUNNER_TEMP/codex-review.json" \
            --output-schema "$GITHUB_WORKSPACE/schemas/review-output.schema.json" \
            --model gpt-5.6-sol \
            --config "model_reasoning_effort=\"$EFFORT\"" \
            --sandbox read-only \
            --ignore-user-config \
            --ephemeral \
            - < "$GITHUB_WORKSPACE/.github/codex/prompts/review-eval.md"

      - name: Grade scenario
        run: node scripts/grade-review.mjs "scenarios/review/${{ inputs.scenario }}" "$RUNNER_TEMP/codex-review.json" --expected-sha "${{ github.sha }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: review-eval-${{ inputs.scenario }}-${{ inputs.effort }}
          path: ${{ runner.temp }}/codex-review.json
          if-no-files-found: warn
          retention-days: 14
