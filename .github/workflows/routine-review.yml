name: Bounded Codex review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      effort:
        description: Reasoning effort
        required: true
        default: high
        type: choice
        options: [high, xhigh, max]

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      status: ${{ steps.validate.outputs.status }}
      blocker_count: ${{ steps.validate.outputs.blocker_count }}
    steps:
      - name: Resolve exact PR head
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const number = Number('${{ inputs.pr_number }}');
            if (!Number.isSafeInteger(number) || number < 1) {
              core.setFailed('pr_number must be a positive integer');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_sha', pr.base.sha);

      - name: Check out trusted control plane
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false

      - name: Check out untrusted PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          path: target
          persist-credentials: false

      - name: Write trusted review context
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        working-directory: target
        run: |
          rm -f .codex-review-context.json
          node -e 'require("node:fs").writeFileSync(".codex-review-context.json", JSON.stringify({prNumber: Number(process.env.PR_NUMBER), baseSha: process.env.BASE_SHA, headSha: process.env.HEAD_SHA}, null, 2))'

      - name: Run read-only bounded review
        id: codex
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ github.workspace }}/control/.github/codex/prompts/routine-review.md
          output-file: ${{ runner.temp }}/codex-review.json
          output-schema-file: ${{ github.workspace }}/control/schemas/review-output.schema.json
          working-directory: ${{ github.workspace }}/target
          model: gpt-5.6-sol
          effort: ${{ inputs.effort }}
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'

      - name: Validate and render bounded result
        id: validate
        env:
          EXPECTED_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          node control/scripts/validate-review-output.mjs "$RUNNER_TEMP/codex-review.json" --expected-sha "$EXPECTED_SHA" --github-output "$GITHUB_OUTPUT"
          node control/scripts/render-review-comment.mjs "$RUNNER_TEMP/codex-review.json" "$RUNNER_TEMP/review-comment.md"

      - name: Upload review handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bounded-review-${{ inputs.pr_number }}-${{ steps.pr.outputs.head_sha }}
          path: |
            ${{ runner.temp }}/codex-review.json
            ${{ runner.temp }}/review-comment.md
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bounded-review-${{ inputs.pr_number }}-${{ needs.review.outputs.head_sha }}

      - name: Verify head and replace the bounded review comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEWED_HEAD: ${{ needs.review.outputs.head_sha }}
        with:
          script: |
            const fs = require('node:fs');
            const number = Number(process.env.PR_NUMBER);
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            if (pr.head.sha !== process.env.REVIEWED_HEAD) {
              core.setFailed(`PR head moved to ${pr.head.sha}; refusing to publish stale review`);
              return;
            }
            const body = fs.readFileSync('review-comment.md', 'utf8');
            const marker = '<!-- sol-5-6-bounded-review -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              per_page: 100,
            });
            const previous = comments.find((comment) => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body,
              });
            }

      - name: Enforce the bounded result
        env:
          REVIEW_STATUS: ${{ needs.review.outputs.status }}
          BLOCKER_COUNT: ${{ needs.review.outputs.blocker_count }}
        run: |
          if [ "$REVIEW_STATUS" = "block" ]; then
            echo "Bounded review reported $BLOCKER_COUNT blocking finding(s)."
            exit 1
          fi
