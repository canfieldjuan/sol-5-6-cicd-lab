name: Codex implementation scenario

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Implementation scenario
        required: true
        default: stable-idempotency-retry
        type: choice
        options:
          - stable-idempotency-retry
          - stale-session-response
      effort:
        description: Reasoning effort
        required: true
        default: high
        type: choice
        options: [high, xhigh, max]

permissions:
  contents: read

concurrency:
  group: codex-pro-account
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: [self-hosted, linux, codex-pro]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Write trusted scenario context
        env:
          TASK_FILE: ${{ github.workspace }}/scenarios/implementation/${{ inputs.scenario }}/task.md
        working-directory: scenarios/implementation/${{ inputs.scenario }}/workspace
        run: |
          rm -f .codex-eval-context.json
          node -e 'require("node:fs").writeFileSync(".codex-eval-context.json", JSON.stringify({taskFile: process.env.TASK_FILE}, null, 2))'

      - name: Verify ChatGPT-managed Codex auth
        run: codex login status 2>&1 | grep -F "Logged in using ChatGPT"

      - name: Run scoped implementation
        env:
          EFFORT: ${{ inputs.effort }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          codex exec \
            --skip-git-repo-check \
            --cd "$GITHUB_WORKSPACE/scenarios/implementation/$SCENARIO/workspace" \
            --output-last-message "$RUNNER_TEMP/codex-implementation.md" \
            --model gpt-5.6-sol \
            --config "model_reasoning_effort=\"$EFFORT\"" \
            --sandbox workspace-write \
            --ignore-user-config \
            --ephemeral \
            - < "$GITHUB_WORKSPACE/.github/codex/prompts/implementation-eval.md"

      - name: Grade tests and changed scope
        run: node scripts/grade-implementation.mjs "scenarios/implementation/${{ inputs.scenario }}"

      - name: Capture patch
        if: always()
        run: git diff --binary HEAD > codex-implementation.patch

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: implementation-eval-${{ inputs.scenario }}-${{ inputs.effort }}
          path: |
            ${{ runner.temp }}/codex-implementation.md
            codex-implementation.patch
          if-no-files-found: warn
          retention-days: 14
